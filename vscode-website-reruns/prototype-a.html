<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>VS Code website prototype A</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #090909;
			color: #f5f5f5;
		}

		body {
			box-sizing: border-box;
			min-height: 100vh;
			margin: 0;
			padding: 24px;
			display: grid;
			place-items: center;
		}

		main {
			width: min(1440px, 100%);
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(20px, 3vw, 32px);
		}

		p {
			margin: 0 0 20px;
			color: #c8c8c8;
			line-height: 1.5;
		}

		video {
			display: block;
			width: 100%;
			max-height: calc(100vh - 150px);
			background: #000;
			border: 1px solid #333;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<main>
		<h1>VS Code website prototype A</h1>
		<p>Watch the recording from beginning to end. Use full screen, pause, or replay sections if helpful.</p>
		<video controls preload="metadata" playsinline>
			<source src="./prototype-a.mp4" type="video/mp4">
			Your browser does not support MP4 video playback.
		</video>
	</main>
</body>
</html>
